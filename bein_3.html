<!DOCTYPE html>
<html dir="rtl" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer" />
  <title>Beta TV</title>
  <link rel="stylesheet" href="https://www.high-kora.com/TOD/WEB/new.css">
  <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: 'Tajawal', sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .video-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      position: absolute;
      top: 0;
      left: 0;
    }
    .error-message {
      font-size: 20px;
      font-weight: bold;
      color: red;
      display: none;
    }
    #player {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* ===== صورة الشعار الثابتة ===== */
    #overlay-logo {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 75px;
      height: auto;
      z-index: 2147483647; /* أعلى قيمة z-index ممكنة */
      pointer-events: none;
      opacity: 1;
      display: block !important;
      visibility: visible !important;
    }

    /* ظهور الشعار داخل وضع Fullscreen */
    :fullscreen #overlay-logo,
    :-webkit-full-screen #overlay-logo,
    :-moz-full-screen #overlay-logo,
    :-ms-fullscreen #overlay-logo {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 2147483647 !important;
    }
  </style>
</head>
<body>

  <img
    id="overlay-logo"
    src="https://j.top4top.io/p_3886khi8e0.png"
    alt="logo"
  />

  <div class="video-container">
    <div id="player"></div>
    <div class="error-message" id="errorMessage">لا يوجد بث حاليًا</div>
  </div>

  <script>
    jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';

    document.addEventListener("DOMContentLoaded", function () {
      var player = jwplayer("player").setup({
        playlist: [{
          "sources": [
            {
              "type": "hls",
              "file": "https://tv.kooraiq.com:4433/beIN_sport3/tracks-v1a1/mono.m3u8"
            }
          ]
        }],
        width: "100%",
        height: "100%",
        aspectratio: "16:9",
        autostart: true,
        controls: true,
        mute: false,
        volume: 100,
        stretching: "uniform",
        cast: {},
        sharing: {},
        playbackRateControls: true,
        playbackRates: [0.5, 1, 1.25, 1.5, 2]
      });

      // ===== معالجة Fullscreen لنقل الشعار داخل عنصر الـ Fullscreen =====
      function moveLogoToFullscreenElement() {
        var logo = document.getElementById('overlay-logo');
        var fsEl = document.fullscreenElement ||
                   document.webkitFullscreenElement ||
                   document.mozFullScreenElement ||
                   document.msFullscreenElement;

        if (fsEl) {
          // نقل الشعار داخل عنصر الـ Fullscreen حتى يظهر فوقه
          fsEl.appendChild(logo);
        } else {
          // إعادة الشعار إلى body عند الخروج من Fullscreen
          document.body.appendChild(logo);
        }

        ensureLogoVisible();
      }

      document.addEventListener('fullscreenchange', moveLogoToFullscreenElement);
      document.addEventListener('webkitfullscreenchange', moveLogoToFullscreenElement);
      document.addEventListener('mozfullscreenchange', moveLogoToFullscreenElement);
      document.addEventListener('MSFullscreenChange', moveLogoToFullscreenElement);

      // مراقبة حدث Fullscreen الخاص بـ JWPlayer أيضاً
      player.on('fullscreen', function(e) {
        setTimeout(moveLogoToFullscreenElement, 100);
      });
      // ================================================================

      function ensureLogoVisible() {
        var logo = document.getElementById('overlay-logo');
        if (logo) {
          logo.style.display = 'block';
          logo.style.visibility = 'visible';
          logo.style.opacity = '1';
          logo.style.zIndex = '2147483647';
          logo.style.position = 'fixed';
          logo.style.top = '18px';
          logo.style.right = '18px';
          logo.style.width = '80px';
          logo.style.pointerEvents = 'none';
        }
      }
      setInterval(ensureLogoVisible, 500);

      // زر تكبير/تصغير مخصص
      let isExpanded = false;
      const expandSvg = `<svg fill="#ffffff" version="1.1" xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 0 100 100"><g><path d="M22.661,20.5H36c1.104,0,2-0.896,2-2s-0.896-2-2-2H19c-1.104,0-2.5,1.276-2.5,2.381v17c0,1.104,0.896,2,2,2s2-0.896,2-2V24.876l16.042,15.791c0.391,0.391,1.027,0.586,1.539,0.586s1.086-0.195,1.477-0.586c0.781-0.781,0.812-2.237,0.031-3.019L22.661,20.5z"></path><path d="M83,16.5H66c-1.104,0-2,0.896-2,2s0.896,2,2,2h12.605L61.647,37.648c-0.781,0.781-0.781,2.142,0,2.923c0.39,0.391,0.902,0.633,1.414,0.633s0.774-0.171,1.164-0.562l16.274-16.5v11.738c0,1.104,0.896,2,2,2s2-0.896,2-2v-17C84.5,17.776,84.104,16.5,83,16.5z"></path><path d="M36.542,60.962L20.5,76.754V65.881c0-1.104-0.896-2-2-2s-2,0.896-2,2v17c0,1.104,1.396,1.619,2.5,1.619h17c1.104,0,2-0.896,2-2s-0.896-2-2-2H22.529L39.62,63.6c0.781-0.781,0.656-1.951-0.125-2.732C38.715,60.086,37.322,60.181,36.542,60.962z"></path><path d="M82.5,63.881c-1.104,0-2,0.896-2,2v11.606L64.226,60.962c-0.78-0.781-1.923-0.781-2.703,0c-0.781,0.781-0.719,1.856,0.062,2.638l17.152,16.9H66c-1.104,0-2,0.896-2,2s0.896,2,2,2h17c1.104,0,1.5-0.515,1.5-1.619v-17C84.5,64.776,83.604,63.881,82.5,63.881z"></path></g></svg>`;

      player.addButton(expandSvg, "تكبير/تصغير", function () {
        const video = document.querySelector(".jwplayer video");
        if (!video) return;
        video.style.objectFit = isExpanded ? "fill" : "contain";
        isExpanded = !isExpanded;
      }, "expandButton");

      player.on("ready", function () {
        console.log("تم تحميل المشغل بنجاح!");
      });

      // تعطيل أدوات المطور وعناصر النسخ
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && ['KeyC', 'KeyX', 'KeyS', 'KeyU'].includes(e.code)) {
          e.preventDefault();
          alert('نسخ المحتوى غير مسموح!');
        }
        if ((e.ctrlKey && e.shiftKey && e.code === 'KeyI') || e.code === 'F12') {
          e.preventDefault();
          alert('أدوات المطور معطلة!');
        }
      });
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        alert('نسخ الروابط غير مسموح!');
      });
      document.addEventListener('selectstart', function(e) {
        e.preventDefault();
      });
    });
  </script>
</body>
</html>
